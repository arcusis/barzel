name: CI

on:
  push:
    branches: [production, main, feature/*]
  pull_request:
    branches: [production, main]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check + Clippy + Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2

      - name: Cargo Check (all targets)
        run: cargo check --all-targets

      - name: Clippy (strict — no warnings)
        run: cargo clippy -- -D warnings

      - name: Unit + property-based tests
        run: cargo test --lib

  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2

      - name: Build Release
        run: cargo build --release --target ${{ matrix.target }}

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: barzel-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/barzel${{ matrix.os == 'windows-latest' && '.exe' || '' }}

  self-test:
    name: Self-Test (Barzel tests itself)
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build Barzel
        run: cargo build --release

      - name: Run Barzel on itself
        run: ./target/release/barzel run

      - name: Validate report — logic layer must pass
        run: |
          REPORT=$(ls .barzel/reports/*.json | sort | tail -1)
          echo "Report: $REPORT"
          cat "$REPORT" | python3 -c "
          import json, sys
          report = json.load(sys.stdin)
          layers = {l['name']: l for l in report['layers']}
          assert 'logic' in layers, 'logic layer missing from report'
          assert layers['logic']['status'] == 'pass', f'logic layer status: {layers[\"logic\"][\"status\"]}'
          assert 'structural' in layers, 'structural layer missing from report'
          assert 'hostile' in layers, 'hostile layer missing from report'
          print(f'Report status: {report[\"status\"]}')
          print(f'Layers: {list(layers.keys())}')
          print(f'Logic tests run: {layers[\"logic\"][\"metrics\"][\"tests_run\"]}')
          print('All assertions passed.')
          "

      - name: Show full report
        if: always()
        run: ./target/release/barzel report || true
